<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おみせやさん物語</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-width column, like standing behind the counter. Noren (indigo curtain) + paper lantern yellow. */
:root {
  --bg: #e9eef3;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #1b2440;
  --muted: #5a647d;
  --line: #d3dae4;
  --ai: #24386b;          /* noren indigo */
  --on-ai: #f7f4ea;
  --lantern: #f4b400;     /* lantern yellow, the one accent */
  --on-lantern: #1b2440;
  --wall: #f6f1e6;
  --floor: #dcccb2;
  --wood: #b98552;
  --wood-dark: #7d5631;
  --good: #23824a;
  --good-bg: #e2f4e8;
  --bad: #be3b26;
  --bad-bg: #fbe6e1;
  --meh: #8a6a00;
  --meh-bg: #fdf2cc;
  --shadow: 0 2px 0 rgba(27,36,64,.12);
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11172a; --surface: #1a2239; --surface-2: #222b45; --ink: #e9edf6; --muted: #9ca6c0; --line: #2e3858;
    --ai: #34509a; --on-ai: #f7f4ea; --lantern: #ffc62e; --on-lantern: #1b2440;
    --wall: #2a2f45; --floor: #3a3428; --wood: #8f6438; --wood-dark: #5a3d22;
    --good: #5fcf8a; --good-bg: #183a28; --bad: #ff8670; --bad-bg: #42201b; --meh: #f2cf5b; --meh-bg: #3a3218;
    --shadow: 0 2px 0 rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11172a; --surface: #1a2239; --surface-2: #222b45; --ink: #e9edf6; --muted: #9ca6c0; --line: #2e3858;
  --ai: #34509a; --on-ai: #f7f4ea; --lantern: #ffc62e; --on-lantern: #1b2440;
  --wall: #2a2f45; --floor: #3a3428; --wood: #8f6438; --wood-dark: #5a3d22;
  --good: #5fcf8a; --good-bg: #183a28; --bad: #ff8670; --bad-bg: #42201b; --meh: #f2cf5b; --meh-bg: #3a3218;
  --shadow: 0 2px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-weight: 500; font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
}
#app { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-size: 30px; }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .45; }

.btn {
  border: 2px solid var(--ink); background: var(--surface); border-radius: 12px;
  padding: 10px 16px; font-weight: 700; box-shadow: 0 3px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--lantern); color: var(--on-lantern); border-color: var(--ink); }
.btn.big { font-size: 18px; padding: 14px 18px; width: 100%; }
.btn.ghost { box-shadow: none; border-color: var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

/* ---------- title ---------- */
.title-hero { padding: 28px 0 8px; display: flex; flex-direction: column; gap: 14px; }
.title-noren { display: flex; gap: 4px; }
.title-noren span {
  flex: 1; background: var(--ai); color: var(--on-ai); font-family: var(--f-display);
  font-size: clamp(26px, 9vw, 46px); text-align: center; padding: 18px 0 26px; border-radius: 0 0 6px 6px;
}
.lead { font-size: 16px; }
.howto { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.howto div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.howto b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.howto p { font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { .howto { grid-template-columns: 1fr; } }

/* ---------- choice cards ---------- */
.choices { display: grid; gap: 10px; }
.choice {
  text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
  padding: 14px; display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 4px 12px; align-items: start;
}
.choice:hover { border-color: var(--ai); }
.choice.sel { border-color: var(--ai); box-shadow: inset 0 0 0 2px var(--ai); }
.choice .ico { font-size: 38px; line-height: 1; grid-row: span 3; }
.choice .nm { font-family: var(--f-display); font-size: 18px; }
.choice .meta { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.stepper { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.name-input {
  width: 100%; font: inherit; font-size: 20px; font-family: var(--f-display); padding: 12px 14px;
  border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); color: var(--ink);
}

/* ---------- status bar ---------- */
.status {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ai); color: var(--on-ai);
  border-radius: 12px; padding: 8px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.status .day { font-family: var(--f-display); font-size: 15px; line-height: 1.2; }
.status .day small { display: block; font-family: var(--f-body); font-size: 11px; opacity: .85; }
.status .clock { font-family: var(--f-display); font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.status .money { text-align: right; line-height: 1.25; }
.status .money b { font-family: var(--f-display); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums; }
.status .stars { font-size: 12px; color: var(--lantern); letter-spacing: 1px; }

/* ---------- the shop scene ---------- */
.scene { position: relative; height: 210px; border-radius: 14px; overflow: hidden; background: var(--wall); border: 2px solid var(--ink); }
.scene .noren { position: absolute; inset: 0 0 auto; display: flex; gap: 3px; padding: 0 10px; z-index: 2; }
.scene .noren span {
  flex: 1; background: var(--ai); color: var(--on-ai); font-family: var(--f-display); text-align: center;
  font-size: 15px; padding: 6px 0 10px; border-radius: 0 0 5px 5px; transform-origin: top center; animation: sway 5s ease-in-out infinite;
}
.scene .noren span:nth-child(2n) { animation-delay: -1.3s; }
@keyframes sway { 0%,100% { transform: skewX(0deg); } 50% { transform: skewX(-2deg); } }
.scene .floor { position: absolute; inset: auto 0 0; height: 70px; background: var(--floor); border-top: 2px solid var(--wood-dark); }
.scene .counter { position: absolute; left: 0; bottom: 0; width: 34%; height: 92px; background: var(--wood); border-top: 6px solid var(--wood-dark); border-right: 2px solid var(--wood-dark); z-index: 3; }
.scene .counter .owner { position: absolute; top: -46px; left: 18px; font-size: 40px; }
.scene .counter .goods { position: absolute; top: 8px; left: 10px; right: 6px; font-size: 18px; letter-spacing: 2px; overflow: hidden; white-space: nowrap; }
.scene .door { position: absolute; right: 10px; bottom: 70px; width: 56px; height: 96px; border: 3px solid var(--wood-dark); border-bottom: 0; background: var(--surface-2); border-radius: 4px 4px 0 0; }
.scene .poster { position: absolute; left: 40%; top: 50px; font-size: 11px; background: var(--surface); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; transform: rotate(-3deg); color: var(--muted); }
.crowd { position: absolute; bottom: 30px; left: 38%; right: 70px; height: 80px; z-index: 4; }
.crowd .walker { position: absolute; bottom: 0; display: flex; align-items: flex-end; animation: wander var(--dur, 6s) ease-in-out infinite alternate; }
.crowd .walker .p { font-size: 40px; line-height: 1; }
.crowd .walker .held { font-size: 18px; margin-left: -6px; }
.crowd.enter .walker { animation: enter .9s ease-out both, wander var(--dur, 6s) .9s ease-in-out infinite alternate; }
@keyframes enter { from { transform: translateX(160px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes wander { from { transform: translateX(0); } to { transform: translateX(var(--dx, 30px)); } }
.crowd.leave .walker { animation: leave 1s ease-in forwards; }
@keyframes leave { to { transform: translateX(220px); opacity: 0; } }
.bubble {
  position: absolute; z-index: 6; top: 46px; right: 74px; max-width: 58%;
  background: var(--surface); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 6px 10px;
  font-weight: 700; font-size: 14px; animation: pop .35s ease-out both;
}
.bubble::after { content: ""; position: absolute; bottom: -9px; left: 26px; border: 8px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.bubble.good { background: var(--good-bg); }
.bubble.bad { background: var(--bad-bg); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.float-money { position: absolute; z-index: 7; left: 6%; top: 96px; font-family: var(--f-display); font-size: 24px; color: var(--good); animation: rise 1.6s ease-out forwards; text-shadow: 0 2px 0 var(--surface); }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-30px); opacity: 0; } }
.listen { position: absolute; z-index: 6; right: 74px; bottom: 6px; font-size: 12px; font-weight: 700; background: var(--surface); border: 1px solid var(--ink); border-radius: 99px; padding: 2px 10px; }

/* ---------- clue card ---------- */
.clues { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.clue { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-width: 0; animation: fadein .4s both; }
.clue .k { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.clue .v { font-weight: 700; }
.clue.wide { grid-column: 1 / -1; }
.clue.say { background: var(--surface-2); border-style: dashed; border-color: var(--muted); }
.clue.say .v { font-size: 16px; }
@keyframes fadein { from { opacity: .2; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.coach { background: var(--meh-bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.coach b { font-family: var(--f-display); font-weight: 400; }
.regular-card { background: var(--good-bg); border-radius: 12px; padding: 8px 12px; font-size: 14px; }

/* ---------- menu ---------- */
.menu { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.item {
  text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px;
  display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 0 8px; align-items: center; min-width: 0;
}
.item .ic { font-size: 28px; grid-row: span 2; text-align: center; }
.item .nm { font-weight: 900; font-size: 14px; line-height: 1.3; }
.item .fit { font-size: 12px; letter-spacing: 1px; line-height: 1.4; word-break: break-all; }
.item.sel { border-color: var(--ai); box-shadow: inset 0 0 0 2px var(--ai); background: var(--surface-2); }
@media (max-width: 380px) { .menu { grid-template-columns: 1fr; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }

/* ---------- price tag ---------- */
.tag {
  position: relative; background: var(--surface); border: 2px solid var(--ink); border-radius: 16px 16px 16px 16px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.tag::before { content: ""; position: absolute; top: 12px; left: 12px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); background: var(--bg); }
.tag .head { padding-left: 20px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.price-row { display: grid; grid-template-columns: 52px minmax(0,1fr) 52px; gap: 8px; align-items: center; }
.price-row .btn { padding: 8px 0; font-size: 22px; }
.price { text-align: center; font-family: var(--f-display); font-size: 36px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.price small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 700; }
.calc { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; text-align: center; font-size: 12px; }
.calc div { background: var(--surface-2); border-radius: 10px; padding: 6px 4px; }
.calc b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.calc .pos { color: var(--good); }
.calc .neg { color: var(--bad); }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.quick button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 0; font-size: 13px; font-weight: 700; }

/* ---------- result ---------- */
.result { border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; border: 2px solid var(--ink); }
.result.good { background: var(--good-bg); }
.result.meh { background: var(--meh-bg); }
.result.bad { background: var(--bad-bg); }
.result .t { font-family: var(--f-display); font-size: 20px; }
.why { font-size: 14px; }
.needchip { display: inline-block; background: var(--surface); border: 1px solid var(--ink); border-radius: 99px; padding: 0 8px; margin: 0 2px; font-weight: 700; font-size: 13px; }

/* ---------- report ---------- */
.ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ledger td { padding: 7px 2px; border-bottom: 1px dashed var(--line); }
.ledger td:last-child { text-align: right; font-weight: 700; }
.ledger tr.total td { border-bottom: 0; border-top: 2px solid var(--ink); font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.ledger .neg { color: var(--bad); }
.ledger .pos { color: var(--good); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.kpis div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
.kpis b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.kpis span { font-size: 12px; color: var(--muted); }
.memo { background: var(--surface); border-left: 6px solid var(--lantern); border-radius: 0 12px 12px 0; padding: 10px 14px; }
.memo h3 { margin-bottom: 4px; }
.memo ul { margin: 0; padding-left: 1.2em; }
.memo li + li { margin-top: 4px; }

/* ---------- grow ---------- */
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.tabs button { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px; font-weight: 900; font-size: 14px; }
.tabs button.on { background: var(--ai); color: var(--on-ai); border-color: var(--ai); }
.shelf { display: flex; flex-direction: column; gap: 8px; }
.dev { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 4px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.dev .ic { font-size: 30px; text-align: center; }
.dev .nm { font-weight: 900; }
.dev .sub { font-size: 12px; color: var(--muted); }
.dev .btn { padding: 8px 10px; font-size: 13px; white-space: nowrap; }
.ladder { display: flex; flex-direction: column; gap: 6px; }
.rung { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.rung .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 12px; font-weight: 900; }
.rung.done .dot { background: var(--ai); color: var(--on-ai); border-color: var(--ai); }
.rung.now { border: 2px solid var(--ai); }
.rung .nm { font-weight: 900; }
.rung .sub { font-size: 12px; color: var(--muted); }

.win { text-align: center; padding: 24px 8px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.win .big { font-size: 64px; }
.confirm { background: var(--bad-bg); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>

<div id="app"></div>

/* ================= HELPERS ================= */
const $ = (s) => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const yen = (n) => (n < 0 ? "−¥" : "¥") + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function wpick(items, weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const stars = (rep) => { const f = clamp(Math.round(rep), 0, 5); return "★".repeat(f) + "☆".repeat(5 - f); };
const fitIcons = (fit) => Object.entries(fit).filter(([, v]) => v > 0).map(([k, v]) => NEEDS[k].i.repeat(v)).join(" ");
const timeStr = (h, m) => `${String(h % 24).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
const priceStep = (base) => base >= 3000 ? 100 : base >= 1000 ? 50 : 10;
const roundTo = (v, step) => Math.max(step, Math.round(v / step) * step);

/* ================= STATE ================= */
const SAVE_KEY = "omise-monogatari-v1";
let S = null;          // persistent game state
let ui = { phase: "title" };

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

const shop = () => SHOPS[S.shop];
const loc = () => LOCS[S.loc];
const stage = () => STAGES[S.stage];
const products = () => shop().products.filter((p) => S.unlocked.includes(p.id));
const rentToday = () => Math.round(loc().rent * shop().scale * stage().rentMul / 10) * 10;
const wage = () => Math.round(1500 * shop().scale / 10) * 10;

function newGame(shopKey, locKey, name) {
  const sh = SHOPS[shopKey];
  S = {
    shop: shopKey, loc: locKey, name: name || sh.defaultName,
    day: 1, money: Math.round(10000 * sh.scale), rep: 1, stage: 0, staff: 0,
    unlocked: sh.products.filter((p) => p.start).map((p) => p.id),
    regulars: [], won: false,
    stats: { served: 0, left: 0, regularsMade: 0, profit: 0 },
    today: null,
  };
  startDay();
}

/* ================= CUSTOMERS ================= */
function makeCustomer(archKey, hour, opts = {}) {
  const a = ARCH[archKey];
  const size = ri(a.size[0], a.size[1]);
  const pool = pick(a.av);
  const mix = ["students", "club", "jk"].includes(archKey);
  const people = mix ? Array.from({ length: size }, () => pick(pool)) : pool.slice(0, size);
  while (people.length < size) people.push(pick(pool));
  const says = [...a.say].sort(() => Math.random() - 0.5);
  return {
    arch: archKey, hour, min: ri(0, 5) * 10 + ri(0, 9), size, payers: a.payers || size,
    people, look: pick(a.look), item: pick(a.items),
    say1: opts.say1 || says[0], say2: says.find((s) => s !== (opts.say1 || says[0])),
    regId: opts.regId || null,
  };
}

function archWeights(hour) {
  const li = LOC_IDX[S.loc];
  const keys = Object.keys(ARCH);
  const w = keys.map((k) => {
    const a = ARCH[k];
    const inHours = hour >= a.hours[0] && hour < a.hours[1];
    return a.w[li] * (inHours ? 1 : 0.04);
  });
  return [keys, w];
}

function startDay() {
  const sh = shop(), lc = loc(), st = stage();
  const n = clamp(Math.round((lc.traffic + st.traffic + S.rep * 0.8) * sh.traffic), 3, 12);
  const [open, close] = sh.hours;
  const hours = Array.from({ length: n }, () => ri(open, close - 1)).sort((a, b) => a - b);
  const list = hours.map((h) => { const [k, w] = archWeights(h); return makeCustomer(wpick(k, w), h); });

  // regulars come back
  const back = S.regulars.filter(() => Math.random() < lc.regular).slice(0, Math.ceil(n / 2));
  back.forEach((r) => {
    const a = ARCH[r.arch];
    const lo = Math.max(open, a.hours[0]), hi = Math.min(close, a.hours[1]) - 1;
    const h = hi >= lo ? ri(lo, hi) : ri(open, close - 1);
    const idx = Math.floor(Math.random() * list.length);
    list[idx] = makeCustomer(r.arch, h, { regId: r.id });
  });
  list.sort((a, b) => a.hour - b.hour || a.min - b.min);

  // tutorial: the very first customer is the tired office worker
  if (S.day === 1) {
    const h = clamp(21, open, close - 1);
    list[list.length - 1] = makeCustomer("overtime", h, { say1: "はぁ…疲れた" });
    list[list.length - 1].min = 10;
    const first = list.pop(); list.unshift(first);
  }

  S.today = {
    customers: list, idx: 0, hints: 3,
    log: { sales: 0, cost: 0, happy: 0, left: 0, newRegs: 0, expensive: 0, cheap: 0, mismatch: 0, grudging: 0 },
  };
  save();
  ui = { phase: "serve", sel: null, price: 0, heard: false, hint: false, result: null };
  render();
}

/* ================= JUDGEMENT ================= */
function evaluate(c, p, price) {
  const a = ARCH[c.arch];
  const [n1, n2] = a.needs;
  const fit = Math.min(1, ((p.fit[n1] || 0) + 0.6 * (n2 ? (p.fit[n2] || 0) : 0)) / 3);
  const reg = c.regId ? S.regulars.find((r) => r.id === c.regId) : null;
  const budget = a.budget * loc().budget * stage().budget * (reg ? 1.1 : 1);
  const will = p.base * budget * (0.7 + 0.5 * fit);
  const qty = p.share ? 1 : c.payers;
  let kind;
  if (fit < 0.3) kind = "mismatch";
  else if (price > will * 1.12) kind = "expensive";
  else if (price > will) kind = "grudging";
  else if (fit < 0.6) kind = price < will * 0.72 ? "cheapok" : "ok";
  else kind = price < will * 0.72 ? "cheapreg" : "regular";
  return { kind, fit, will: Math.round(will), qty, reg };
}

const LINES = {
  mismatch: ["うーん、今はそういう気分じゃないんだ…", "ほしいのと、ちょっとちがうかな…", "また今度にします…"],
  expensive: ["えっ、高っ…！ やめておきます", "うーん、お財布的にムリかな…", "ちょっと予算オーバーだなぁ"],
  grudging: ["ちょっと高いけど…まあいいか", "うーん…今日だけね", "高いなぁ。でも食べたいし…"],
  ok: ["ごちそうさま", "まあまあかな", "ふつうに良かったよ"],
  cheapok: ["えっ、こんなに安いの？", "安くて助かる〜"],
  regular: ["これこれ！ また来るね！", "最高！ ぜったいまた来ます！", "わかってるねぇ！ また来るよ"],
  cheapreg: ["こんなに安くていいの!? また来るね！", "最高で安い！ 毎日来ちゃうかも！"],
};

function recommend() {
  const c = S.today.customers[S.today.idx];
  const p = shop().products.find((x) => x.id === ui.sel);
  const price = ui.price;
  const r = evaluate(c, p, price);
  const L = S.today.log;
  const buys = !["mismatch", "expensive"].includes(r.kind);
  let sales = 0, cost = 0, newReg = null, repDelta = 0;
  if (buys) {
    sales = price * r.qty; cost = p.cost * r.qty;
    L.sales += sales; L.cost += cost; S.stats.served++;
  } else { L.left++; S.stats.left++; }
  if (r.kind === "mismatch") { L.mismatch++; repDelta = -0.08; }
  if (r.kind === "expensive") { L.expensive++; repDelta = -0.1; }
  if (r.kind === "grudging") { L.grudging++; repDelta = 0; }
  if (r.kind === "ok" || r.kind === "cheapok") { L.happy++; repDelta = 0.03; }
  if (r.kind === "cheapok" || r.kind === "cheapreg") L.cheap++;
  if (r.kind === "regular" || r.kind === "cheapreg") {
    L.happy++; repDelta = 0.12;
    if (r.reg) { r.reg.visits++; r.reg.fav = p.id; r.reg.last = price; }
    else {
      newReg = { id: "r" + Date.now() + ri(0, 999), name: pick(SURNAMES), arch: c.arch, fav: p.id, last: price, visits: 1 };
      S.regulars.push(newReg); if (S.regulars.length > 30) S.regulars.shift();
      L.newRegs++; S.stats.regularsMade++;
    }
  }
  if (r.reg && !buys) { // a regular who leaves unhappy may not come back
    if (Math.random() < 0.5) S.regulars = S.regulars.filter((x) => x !== r.reg);
  }
  S.money += sales - cost;
  S.rep = clamp(S.rep + repDelta, 0, 5);
  ui.result = { ...r, p, price, sales, profit: sales - cost, newReg, line: pick(LINES[r.kind]) };
  save();
  render();
}

function nextCustomer() {
  S.today.idx++;
  save();
  if (S.today.idx >= S.today.customers.length) { closeDay(); return; }
  ui = { phase: "serve", sel: null, price: 0, heard: false, hint: false, result: null };
  render();
}

/* ================= END OF DAY ================= */
function closeDay() {
  const L = S.today.log, sh = shop(), st = stage();
  const avgMargin = products().reduce((s, p) => s + (p.base * st.budget - p.cost), 0) / products().length;
  const staffCustomers = S.staff * (2 + Math.floor(S.rep / 1.5));
  const staffProfit = Math.round(staffCustomers * avgMargin * 1.6 * 0.7 / 10) * 10;
  const wages = S.staff * wage();
  const branch = Math.round(st.branches * 5000 * sh.scale * (0.5 + S.rep / 5) / 10) * 10;
  const rent = rentToday();
  const profit = L.sales - L.cost - rent - wages + staffProfit + branch;
  S.money += -rent - wages + staffProfit + branch;
  S.stats.profit += profit;
  ui = { phase: "report", rep: { ...L, rent, wages, staffCustomers, staffProfit, branch, profit } };
  S.today = null;
  S.day++;
  save();
  render();
}

function tipsFor(R) {
  const sh = shop(), tips = [];
  const ratio = R.sales > 0 ? Math.round(R.cost / R.sales * 100) : 0;
  if (R.sales > 0) tips.push(`今日の<b>原価率</b>は ${ratio}%（売上のうち、仕入れにかかった割合）。${sh.name}は ${sh.costGuide}% くらいが目安。${ratio > sh.costGuide + 10 ? "値段が安すぎるかも。" : ratio < sh.costGuide - 12 ? "しっかり儲けが出ているね。" : "いい感じ！"}`);
  if (R.expensive >= 2) tips.push(`値段が高すぎて帰った人が ${R.expensive}人。学生や子どもはお財布が小さく、観光客や記念日の人は大きい。お客さんを見て値段を変えよう。`);
  if (R.cheap >= 2) tips.push(`「安い！」と驚かれたのが ${R.cheap}回。喜ばれるけど、<b>売値 − 仕入れ値 = 儲け</b>。もう少し上げても買ってくれたかも。`);
  if (R.mismatch >= 2) tips.push(`ほしいものとちがって帰った人が ${R.mismatch}人。合う商品がないなら、「お店を育てる」で新しい商品をつくろう。`);
  if (R.newRegs > 0) tips.push(`新しい常連さんが ${R.newRegs}人！ 常連さんはまた来てくれて、少し高くても買ってくれる。お店の評判も上がるよ。`);
  if (R.profit < 0) tips.push(`今日は赤字…。家賃（${yen(R.rent)}）は、お客さんが来なくても毎日かかる。家賃の高い場所ほど、たくさん売る必要がある。`);
  if (R.staffCustomers > 0) tips.push(`スタッフが ${R.staffCustomers}人を接客してくれた。お給料（${yen(R.wages)}）より稼いでくれれば、雇った意味がある。`);
  if (tips.length < 3) {
    const extra = [
      `場所選びは「家賃」と「来るお客さん」のバランス。${loc().name}は ${loc().desc.split("。")[0]}。`,
      "1回きりのお客さんより、何度も来てくれる常連さんがお店をささえる。",
      "評判の★が上がると、お客さんが増える。いい接客がいちばんの宣伝。",
      "グループ客は人数分買ってくれるから、1組で大きな売上になる。",
    ];
    tips.push(extra[S.day % extra.length]);
  }
  return tips.slice(0, 3);
}

/* ================= GROW ================= */
function develop(id) {
  const p = shop().products.find((x) => x.id === id);
  const cost = p.dev;
  if (S.money < cost || S.unlocked.includes(id)) return;
  S.money -= cost; S.unlocked.push(id); save(); render();
}
function expand() {
  const next = STAGES[S.stage + 1];
  if (!next) return;
  const cost = Math.round(next.cost * shop().scale);
  if (S.money < cost) return;
  S.money -= cost; S.stage++;
  save();
  if (S.stage === STAGES.length - 1 && !S.won) { S.won = true; save(); ui = { phase: "win" }; }
  render();
}
function hire(delta) {
  const n = S.staff + delta;
  if (n < 0 || n > stage().staffMax) return;
  S.staff = n; save(); render();
}

}

function norenText(name) {
  // one curtain panel per word; long words are cut into pieces of up to 4 characters
  const out = [];
  name.trim().split(/[\s　]+/).filter(Boolean).forEach((w) => {
    const ch = [...w];
    for (let i = 0; i < ch.length; i += 4) out.push(ch.slice(i, i + 4).join(""));
  });
  if (out.length === 1 && [...out[0]].length > 2) { const ch = [...out[0]]; const h = Math.ceil(ch.length / 2); out.splice(0, 1, ch.slice(0, h).join(""), ch.slice(h).join("")); }
  return out.slice(0, 5).map((t) => `<span>${esc(t)}</span>`).join("");
}

  </div>
  ${body}
  <button class="btn primary big" data-act="next-day">${S.day}日目の営業をはじめる</button>`;
}

function vWin() {
  return `${statusBar("🎉")}
  <div class="win">
    <div class="big">🏙️</div>
    <h1>チェーン店になった！</h1>
    <p>屋台からはじめた「${esc(S.name)}」は、${S.day}日目で街じゅうに広がりました。</p>
    <div class="kpis" style="width:100%">
      <div><b>${S.stats.served}</b><span>買ってくれた組</span></div>
      <div><b>${S.stats.regularsMade}</b><span>できた常連さん</span></div>
      <div><b>${stars(S.rep)}</b><span>評判</span></div>
    </div>
    <p class="muted small">ちがうお店や場所でも遊んでみよう。場所が変わると、来るお客さんも作戦も変わるよ。</p>
    <button class="btn primary big" data-act="to-grow">このまま続ける</button>
    <button class="btn big" data-act="to-title">タイトルへ</button>
  </div>`;
}

/* ================= EVENTS ================= */
function bind() {
  document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => act(b.dataset.act)));
  document.querySelectorAll("[data-shop]").forEach((b) => b.addEventListener("click", () => { ui.shop = b.dataset.shop; ui.phase = "pickLoc"; render(); }));
  document.querySelectorAll("[data-loc]").forEach((b) => b.addEventListener("click", () => { ui.loc = b.dataset.loc; ui.phase = "pickName"; render(); }));
  document.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => {
    const p = shop().products.find((x) => x.id === b.dataset.pick);
    ui.sel = p.id; ui.price = p.base; render();
    const t = document.querySelector(".tag"); if (t) t.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }));
  document.querySelectorAll("[data-mul]").forEach((b) => b.addEventListener("click", () => {
    const p = shop().products.find((x) => x.id === ui.sel);
    ui.price = roundTo(p.base * Number(b.dataset.mul), priceStep(p.base)); render();
  }));
  document.querySelectorAll("[data-dev]").forEach((b) => b.addEventListener("click", () => develop(b.dataset.dev)));
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { ui.tab = b.dataset.tab; render(); }));
  const nm = $("#shopname"); if (nm) nm.addEventListener("input", () => { ui.name = nm.value; });
}

function act(a) {
  const p = ui.sel ? shop().products.find((x) => x.id === ui.sel) : null;
  switch (a) {
    case "new": if (load()) { ui.confirmNew = true; render(); } else { ui = { phase: "pickShop" }; render(); } break;
    case "new-yes": wipe(); S = null; ui = { phase: "pickShop" }; render(); break;
    case "new-no": ui.confirmNew = false; render(); break;
    case "continue": S = load(); if (!S) { ui = { phase: "title" }; render(); break; }
      if (S.today) { ui = { phase: "serve", sel: null, price: 0, heard: false, hint: false, result: null }; render(); }
      else { ui = { phase: "grow", tab: "menu" }; render(); }
      break;
    case "to-title": ui = { phase: "title" }; render(); break;
    case "to-shop": ui.phase = "pickShop"; render(); break;
    case "to-loc": ui.phase = "pickLoc"; render(); break;
    case "open": newGame(ui.shop, ui.loc, (ui.name || "").trim()); break;
    case "listen": ui.heard = true; render(); break;
    case "hint": if (S.today.hints > 0) { S.today.hints--; ui.hint = true; save(); render(); } break;
    case "up": ui.price += priceStep(p.base); render(); break;
    case "down": ui.price = Math.max(priceStep(p.base), ui.price - priceStep(p.base)); render(); break;
    case "recommend": recommend(); break;
    case "next": nextCustomer(); break;
    case "to-grow": ui = { phase: "grow", tab: ui.tab || "menu" }; render(); break;
    case "hire": hire(1); break;
    case "fire": hire(-1); break;
    case "expand": expand(); break;
    case "next-day": startDay(); break;
  }
}

render();
})();
</script>

</body>
</html>
